# Example workflow for a repository that wants Fence comments on PRs.
name: fence
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pin to a release tag once published; `./` works when this repo itself is the action.
      - uses: actions/checkout@v4
      - uses: ./
