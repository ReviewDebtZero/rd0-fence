<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img"
     aria-label="rd0/fence: did the agent do more than it was asked? Fence compares a pull request with its linked issue and flags each out-of-scope part with a reason.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1023"/><stop offset="0.55" stop-color="#151a3d"/><stop offset="1" stop-color="#0c2a3a"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.15" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.45"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.30"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#glowA)"/>
  <rect width="1280" height="400" fill="url(#glowB)"/>
  <rect width="1280" height="400" fill="url(#dots)"/>

  <g font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace">
    <text x="64" y="118" font-size="64" font-weight="700"><tspan fill="#60a5fa">rd0</tspan><tspan fill="#64748b" font-weight="400"> / </tspan><tspan fill="#f8fafc">fence</tspan></text>
  </g>
  <g font-family="Inter,'DejaVu Sans',Helvetica,Arial,sans-serif">
    <text x="64" y="188" font-size="38" font-weight="800" fill="#f8fafc">Did the agent do</text>
    <text x="64" y="234" font-size="38" font-weight="800" fill="url(#title)">more than it was asked?</text>
    <text x="64" y="290" font-size="19" fill="#cbd5e1">Fence reads the linked issue, checks every changed file,</text>
    <text x="64" y="318" font-size="19" fill="#cbd5e1">and flags each out-of-scope part with a reason.</text>
    <text x="64" y="364" font-size="16" fill="#94a3b8">CPU only · no API key · GitHub Action + CLI · MIT</text>
  </g>

  <!-- issue card -->
  <g font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace">
    <rect x="690" y="44" width="526" height="86" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <circle cx="716" cy="72" r="8" fill="#22c55e"/>
    <text x="734" y="78" font-size="17" fill="#f8fafc">issue #4  <tspan fill="#94a3b8">asks for</tspan></text>
    <text x="712" y="110" font-size="16" fill="#cbd5e1">docs/USERS_GUIDE.md: say what min-lines counts</text>

    <!-- PR files -->
    <rect x="690" y="148" width="526" height="210" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="712" y="180" font-size="17" fill="#f8fafc">PR #5  <tspan fill="#94a3b8">changes</tspan></text>

    <rect x="708" y="196" width="490" height="34" rx="8" fill="#14532d" fill-opacity="0.55"/>
    <text x="722" y="219" font-size="15" fill="#86efac">✓ docs/USERS_GUIDE.md</text>
    <text x="1186" y="219" font-size="13" fill="#86efac" text-anchor="end">in scope</text>

    <rect x="708" y="236" width="490" height="34" rx="8" fill="#78350f" fill-opacity="0.55"/>
    <text x="722" y="259" font-size="15" fill="#fde68a">! .github/workflows/ci.yml</text>
    <text x="1186" y="259" font-size="13" fill="#fde68a" text-anchor="end">CI, not asked</text>

    <rect x="708" y="276" width="490" height="34" rx="8" fill="#78350f" fill-opacity="0.55"/>
    <text x="722" y="299" font-size="15" fill="#fde68a">! pyproject.toml</text>
    <text x="1186" y="299" font-size="13" fill="#fde68a" text-anchor="end">dependencies</text>

    <rect x="708" y="316" width="490" height="34" rx="8" fill="#78350f" fill-opacity="0.55"/>
    <text x="722" y="339" font-size="15" fill="#fde68a">! src/rd0_fence/cli.py</text>
    <text x="1186" y="339" font-size="13" fill="#fde68a" text-anchor="end">unrelated code</text>
  </g>
</svg>
